name: build

on: push

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node build.mjs
      - name: commit rebuilt script if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/script.min.js
          git diff --cached --quiet || { git commit -m "chore: update minified script" && git push; }
